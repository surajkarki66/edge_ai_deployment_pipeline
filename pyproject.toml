[project]
name = "edge-ai-deployment-pipeline"
version = "0.1.0"
description = "Edge AI deployment pipeline for computer-vision models — profile, compat-check, constrain, deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "fvcore>=0.1.5",
    "tensorflow>=2.14",
    "ncnn>=1.0.20260114",
    "pnnx>=20260409",
    "onnx>=1.21.0",
    "onnxslim>=0.1.71",
    "onnxruntime>=1.26.0",
    "tensorrt>=10.16.1.11"
]

[project.optional-dependencies]
pytorch = ["torch>=2.0", "fvcore>=0.1.5"]
tensorflow = ["tensorflow>=2.14"]
arm = ["ncnn>=1.0.20260114", "pnnx>=20260409"]
jetson = [
    "tensorflow>=2.14",
    "tf2onnx>=1.17.0",
    "onnx>=1.21.0",
    "onnxslim>=0.1.71",
    "onnxruntime>=1.26.0",
    "tensorrt>=10.16.1.11",
]
dev = [
    "mypy>=1.8",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/core", "src/stages", "src/adapters", "src/config", "src/operators"]
strict = true
ignore_missing_imports = true
incremental = false
