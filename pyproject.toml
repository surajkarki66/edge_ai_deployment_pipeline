[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ai_deployment_pipeline"]

[tool.hatch.build.targets.editable]
packages = ["src/edge_ai_deployment_pipeline"]

[project]
name = "edge-ai-deployment-pipeline"
version = "0.1.0"
description = "Edge AI deployment pipeline for computer-vision models — profile, compat-check, constrain, deploy"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0",
    "ultralytics==8.4.24",
    "fvcore>=0.1.5",
    "tensorflow>=2.14",

    "ncnn>=1.0.20260114",
    "pnnx>=20260409",

    "onnx>=1.21.0",
    "onnxslim>=0.1.71",
    "onnxruntime>=1.26.0",
    "onnx2torch>=1.5.15",
    "tf2onnx>=1.17.0",

    "tensorrt>=10.16.1.11,<11",

    "mako>=1.3.0",
    "munch>=4.0.0",
    "hydra-core>=1.3.3",
    "mlflow>=3.14.0",
    "clearml>=2.1.9",
    "texttable>=1.7.0",
    "seaborn>=0.13.2",
    "loguru>=0.7.3",
    "pycocotools>=2.0.11",
    "marshmallow>=4.3.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
edge-ai-deploy = "edge_ai_deployment_pipeline.main:main"
edge-ai-doctor = "edge_ai_deployment_pipeline.core.host_check:main"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
files = [
    "src/edge_ai_deployment_pipeline/core",
    "src/edge_ai_deployment_pipeline/steps",
    "src/edge_ai_deployment_pipeline/config",
    "src/edge_ai_deployment_pipeline/adapters/base.py",
    "src/edge_ai_deployment_pipeline/adapters/arm",
    "src/edge_ai_deployment_pipeline/adapters/fpga",
    "src/edge_ai_deployment_pipeline/adapters/jetson",
    "src/edge_ai_deployment_pipeline/adapters/mcu/adapter.py",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/base.py",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/registry.py",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/stm32n6/toolchain.py",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/stm32n6/c_projects.py",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/stm32n6/object_detection/deploy_od.py",
]
exclude = [
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/stm32n6/object_detection/.*",
    "src/edge_ai_deployment_pipeline/adapters/mcu/toolchains/stm32n6/image_classification/.*",
]
strict = true
ignore_missing_imports = true
incremental = false