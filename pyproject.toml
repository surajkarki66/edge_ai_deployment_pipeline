[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ai_deployment_pipeline"]

[tool.hatch.build.targets.editable]
packages = ["src/edge_ai_deployment_pipeline"]

[project]
name = "edge-ai-deployment-pipeline"
version = "0.1.0"
description = "Edge AI deployment pipeline for computer-vision models — profile, compat-check, constrain, deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "fvcore>=0.1.5",
    "tensorflow>=2.14",
    "ncnn>=1.0.20260114",
    "pnnx>=20260409",
    "onnx>=1.21.0",
    "onnxslim>=0.1.71",
    "onnxruntime>=1.26.0",
    "tensorrt>=10.16.1.11,<11",
]

[project.optional-dependencies]
pytorch = ["torch>=2.0", "fvcore>=0.1.5"]
tensorflow = ["tensorflow>=2.14"]
arm = ["ncnn>=1.0.20260114", "pnnx>=20260409"]
jetson = [
    "tensorflow>=2.14",
    "tf2onnx>=1.17.0",
    "onnx>=1.21.0",
    "onnxslim>=0.1.71",
    "onnxruntime>=1.26.0",
    "tensorrt>=10.16.1.11,<11",
]
dev = [
    "mypy>=1.8",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
edge-ai-deploy = "edge_ai_deployment_pipeline.main:main"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = [
    "src/edge_ai_deployment_pipeline/core",
    "src/edge_ai_deployment_pipeline/stages",
    "src/edge_ai_deployment_pipeline/adapters",
    "src/edge_ai_deployment_pipeline/config",
]
strict = true
ignore_missing_imports = true
incremental = false
